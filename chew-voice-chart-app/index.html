<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0F6B5C" />
  <title>CHEW Voice Chart</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --bg-alt: #eaf0ed;
      --ink: #12241f;
      --muted: #5b6b67;
      --primary: #0f6b5c;
      --primary-dark: #0b4f44;
      --primary-light: #e1f0ea;
      --accent: #e0632b;
      --danger: #c43d2e;
      --card: #ffffff;
      --border: #dce3e0;
      --shadow: rgba(15, 50, 42, 0.12);
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }
    button, input, select, textarea {
      font: inherit;
    }
    .app-shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .auth-wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 22px;
    }
    .brand h1 {
      margin: 0 0 2px;
      font-size: 1.1rem;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px var(--shadow);
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg-alt);
      color: var(--ink);
      outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-ghost {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1.5px solid var(--danger);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .link-row {
      margin-top: 14px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .link-row button {
      background: transparent;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }
    .error-box {
      background: rgba(196, 61, 46, 0.1);
      color: var(--danger);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary-dark);
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .meta strong {
      display: block;
      font-size: 0.9rem;
    }
    .meta span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
    }
    .status {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg-alt);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
    }
    .status.online {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .nav {
      display: flex;
      gap: 6px;
      background: var(--bg-alt);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .nav button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 6px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav .active {
      background: var(--card);
      color: var(--primary-dark);
      box-shadow: 0 3px 10px var(--shadow);
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .hero {
      text-align: center;
      margin: 16px 0;
    }
    .hero h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .record-btn-wrap {
      display: flex;
      justify-content: center;
      margin: 18px 0;
    }
    .record-btn {
      width: 180px;
      height: 180px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      box-shadow: 0 14px 34px rgba(224,99,43,0.35);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
    }
    .record-btn.active {
      background: var(--danger);
    }
    .rec-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .action-row .btn {
      flex: 1;
      width: auto;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    .settings-row:last-child {
      border-bottom: none;
    }
    .settings-row .tt {
      font-weight: 700;
      font-size: 0.88rem;
    }
    .settings-row .dd {
      margin-top: 2px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .split-muted {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch .track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--border);
    }
    .switch .track::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .switch input:checked + .track {
      background: var(--primary);
    }
    .switch input:checked + .track::before {
      transform: translateX(20px);
    }
    .cloud-config {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .consult-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .consult-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .consult-name {
      font-weight: 700;
    }
    .consult-date {
      margin-top: 4px;
      font-size: 0.74rem;
      color: var(--muted);
      font-family: monospace;
    }
    .sync-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      background: var(--bg-alt);
      color: var(--muted);
    }
    .sync-pill.synced {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.9rem;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 17, 0.5);
      display: grid;
      place-items: end center;
      z-index: 20;
    }
    .modal-sheet {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 18px 18px 0 0;
      padding: 20px 16px 24px;
      max-height: 85vh;
      overflow: auto;
    }
    .modal-close {
      float: right;
      font-size: 1.5rem;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
    }
    .section-title {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 12px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .transcript-box {
      background: var(--bg-alt);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px;
      line-height: 1.5;
      color: var(--ink);
      min-height: 80px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
    (function () {
      "use strict";
      var h = React.createElement;
      var useState = React.useState;
      var useEffect = React.useEffect;

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }
      function nowIso() { return new Date().toISOString(); }
      function fmtDate(iso) {
        try {
          var d = new Date(iso);
          return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        } catch (e) { return iso || ""; }
      }
      function sha256Hex(str) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
        });
      }
      function genSalt() {
        var bytes = crypto.getRandomValues(new Uint8Array(12));
        return Array.from(bytes).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      }

      var LS_USERS = "chewvoice_users";
      var LS_SESSION = "chewvoice_session";
      var LS_CONSULTS = "chewvoice_consultations";
      var LS_SETTINGS = "chewvoice_settings";

      function lsGet(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (raw == null) return fallback;
          return JSON.parse(raw);
        } catch (e) {
          return fallback;
        }
      }
      function lsSet(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          return false;
        }
      }

      var Store = {
        getUsers: function () { return lsGet(LS_USERS, []); },
        saveUsers: function (list) { return lsSet(LS_USERS, list); },
        getSession: function () { return lsGet(LS_SESSION, null); },
        saveSession: function (s) { return lsSet(LS_SESSION, s); },
        clearSession: function () { try { localStorage.removeItem(LS_SESSION); } catch (e) {} },
        getConsults: function () { return lsGet(LS_CONSULTS, []); },
        saveConsults: function (list) { return lsSet(LS_CONSULTS, list); },
        getSettings: function () {
          return Object.assign({
            language: "en-US",
            cloudSync: false,
            theme: "auto",
            cloudUrl: "",
            cloudKey: ""
          }, lsGet(LS_SETTINGS, {}));
        },
        saveSettings: function (s) { return lsSet(LS_SETTINGS, s); }
      };

      var Auth = {
        register: async function (payload) {
          var users = Store.getUsers();
          var exists = users.some(function (u) { return (u.username || "").toLowerCase() === (payload.username || "").toLowerCase(); });
          if (exists) throw new Error("That username is already taken.");
          var salt = genSalt();
          var passwordHash = await sha256Hex(salt + payload.password);
          var user = {
            id: uid(),
            fullName: payload.fullName,
            username: payload.username,
            passwordHash: passwordHash,
            salt: salt,
            role: payload.role || "CHEW",
            facilityCode: payload.facilityCode || "UNSET",
            createdAt: nowIso()
          };
          users.push(user);
          Store.saveUsers(users);
          return user;
        },
        login: async function (username, password) {
          var users = Store.getUsers();
          var user = users.find(function (u) { return (u.username || "").toLowerCase() === (username || "").toLowerCase(); });
          if (!user) throw new Error("No account with that username.");
          var candidate = await sha256Hex(user.salt + password);
          if (candidate !== user.passwordHash) throw new Error("Incorrect password.");
          var session = {
            userId: user.id,
            fullName: user.fullName,
            username: user.username,
            role: user.role,
            facilityCode: user.facilityCode,
            loginAt: nowIso()
          };
          Store.saveSession(session);
          return session;
        },
        logout: function () {
          Store.clearSession();
        }
      };

      var Cloud = {
        isConfigured: function (settings) {
          settings = settings || Store.getSettings();
          return !!settings.cloudSync && !!settings.cloudUrl && !!settings.cloudKey;
        },
        mockUpload: function (record) {
          return new Promise(function (resolve) {
            setTimeout(function () {
              resolve({ ok: true, id: record.id, uploadedAt: nowIso() });
            }, 700);
          });
        },
        uploadOne: async function (record, settings) {
          settings = settings || Store.getSettings();
          if (!Cloud.isConfigured(settings)) return false;
          var result = await Cloud.mockUpload(record, settings);
          return !!result.ok;
        },
        syncPending: async function () {
          var settings = Store.getSettings();
          if (!Cloud.isConfigured(settings)) return false;
          var consults = Store.getConsults();
          var pending = consults.filter(function (r) { return r.syncStatus === "Pending"; });
          var changed = false;
          for (var i = 0; i < pending.length; i++) {
            try {
              await Cloud.uploadOne(pending[i], settings);
              pending[i].syncStatus = "Synced";
              changed = true;
            } catch (e) {
              console.warn("Upload failed", e);
            }
          }
          if (changed) {
            Store.saveConsults(consults);
          }
          return true;
        }
      };

      window.addEventListener("online", function () {
        if (Cloud.isConfigured(Store.getSettings())) {
          Cloud.syncPending().catch(function () {});
        }
      });

      var FIELD_GROUPS = [
        {
          key: "patient",
          title: "Patient Info",
          fields: [
            { key: "fullName", label: "Full name", type: "text" },
            { key: "age", label: "Age", type: "text" },
            { key: "gender", label: "Gender", type: "select", options: ["", "Male", "Female"] },
            { key: "cardNumber", label: "Card number", type: "text" },
            { key: "village", label: "Village / address", type: "text" },
            { key: "phone", label: "Phone", type: "text" }
          ]
        },
        {
          key: "vitals",
          title: "Vitals",
          fields: [
            { key: "temperature", label: "Temperature", type: "text" },
            { key: "bloodPressure", label: "Blood pressure", type: "text" },
            { key: "pulseRate", label: "Pulse rate", type: "text" },
            { key: "respiratoryRate", label: "Respiratory rate", type: "text" },
            { key: "weight", label: "Weight", type: "text" }
          ]
        },
        {
          key: "clinical",
          title: "Clinical",
          fields: [
            { key: "chiefComplaint", label: "Chief complaint", type: "textarea" },
            { key: "diagnosis", label: "Diagnosis", type: "textarea" },
            { key: "treatment", label: "Treatment", type: "textarea" }
          ]
        },
        {
          key: "followUp",
          title: "Follow-up",
          fields: [
            { key: "referral", label: "Referral", type: "text" },
            { key: "followUpDate", label: "Follow-up date", type: "text" },
            { key: "notes", label: "Notes", type: "textarea" }
          ]
        }
      ];

      function emptyFields() {
        var out = {};
        FIELD_GROUPS.forEach(function (group) {
          group.fields.forEach(function (field) {
            out[field.key] = "";
          });
        });
        return out;
      }

      function LoginScreen(props) {
        var [username, setUsername] = useState("");
        var [password, setPassword] = useState("");
        var [error, setError] = useState("");
        var [busy, setBusy] = useState(false);

        function submit(e) {
          e.preventDefault();
          setError("");
          setBusy(true);
          Auth.login(username.trim(), password).then(function (session) {
            setBusy(false);
            props.onAuthed(session);
          }).catch(function (err) {
            setBusy(false);
            setError(err.message || "Could not sign in.");
          });
        }

        return h("div", { className: "app-shell auth-wrap" },
          h("div", null,
            h("div", { className: "brand" },
              h("div", { className: "brand-mark" }, "🎙"),
              h("div", null,
                h("h1", null, "CHEW Voice Chart"),
                h("p", null, "Offline speech-to-text patient documentation")
              )
            ),
            h("div", { className: "card" },
              error ? h("div", { className: "error-box" }, error) : null,
              h("form", { onSubmit: submit },
                h("div", { className: "field" },
                  h("label", null, "Username"),
                  h("input", { value: username, onChange: function (e) { setUsername(e.target.value); }, required: true })
                ),
                h("div", { className: "field" },
                  h("label", null, "Password"),
                  h("input", { type: "password", value: password, onChange: function (e) { setPassword(e.target.value); }, required: true })
                ),
                h("button", { type: "submit", className: "btn btn-primary", disabled: busy }, busy ? "Signing in…" : "Sign in")
              )
            ),
            h("div", { className: "link-row" }, "New CHEW on this device? ", h("button", { type: "button", onClick: props.onGoRegister }, "Create an account"))
          )
        );
      }

      function RegisterScreen(props) {
        var [fullName, setFullName] = useState("");
        var [username, setUsername] = useState("");
        var [password, setPassword] = useState("");
        var [facilityCode, setFacilityCode] = useState("");
        var [role, setRole] = useState("CHEW");
        var [error, setError] = useState("");
        var [busy, setBusy] = useState(false);

        function submit(e) {
          e.preventDefault();
          setError("");
          setBusy(true);
          Auth.register({ fullName: fullName.trim(), username: username.trim(), password: password, role: role, facilityCode: facilityCode.trim() || "UNSET" })
            .then(function () { return Auth.login(username.trim(), password); })
            .then(function (session) {
              setBusy(false);
              props.onAuthed(session);
            }).catch(function (err) {
              setBusy(false);
              setError(err.message || "Could not create account.");
            });
        }

        return h("div", { className: "app-shell auth-wrap" },
          h("div", null,
            h("div", { className: "brand" },
              h("div", { className: "brand-mark" }, "🎙"),
              h("div", null,
                h("h1", null, "Create your account"),
                h("p", null, "Local to this device — cloud sync is optional")
              )
            ),
            h("div", { className: "card" },
              error ? h("div", { className: "error-box" }, error) : null,
              h("form", { onSubmit: submit },
                h("div", { className: "field" },
                  h("label", null, "Full name"),
                  h("input", { value: fullName, onChange: function (e) { setFullName(e.target.value); }, required: true })
                ),
                h("div", { className: "field" },
                  h("label", null, "Username"),
                  h("input", { value: username, onChange: function (e) { setUsername(e.target.value); }, required: true })
                ),
                h("div", { className: "field" },
                  h("label", null, "Password"),
                  h("input", { type: "password", value: password, onChange: function (e) { setPassword(e.target.value); }, required: true, minLength: 4 })
                ),
                h("div", { className: "field-row" },
                  h("div", { className: "field" },
                    h("label", null, "Facility code"),
                    h("input", { value: facilityCode, onChange: function (e) { setFacilityCode(e.target.value); }, placeholder: "e.g. CRS-01" })
                  ),
                  h("div", { className: "field" },
                    h("label", null, "Role"),
                    h("select", { value: role, onChange: function (e) { setRole(e.target.value); } },
                      h("option", { value: "CHEW" }, "CHEW"),
                      h("option", { value: "ADMIN" }, "Admin")
                    )
                  )
                ),
                h("button", { type: "submit", className: "btn btn-primary", disabled: busy }, busy ? "Creating…" : "Create account & sign in")
              )
            ),
            h("div", { className: "link-row" }, "Already have an account? ", h("button", { type: "button", onClick: props.onGoLogin }, "Sign in"))
          )
        );
      }

      function Field(props) {
        var def = props.def;
        var value = props.value || "";
        var onChange = props.onChange;
        if (def.type === "select") {
          return h("div", { className: "field" },
            h("label", null, def.label),
            h("select", { value: value, onChange: function (e) { onChange(def.key, e.target.value); } },
              def.options.map(function (option) {
                return h("option", { value: option, key: option || "blank" }, option || "Select…");
              })
            )
          );
        }
        if (def.type === "textarea") {
          return h("div", { className: "field" },
            h("label", null, def.label),
            h("textarea", { rows: 2, value: value, onChange: function (e) { onChange(def.key, e.target.value); }, placeholder: "—" })
          );
        }
        return h("div", { className: "field" },
          h("label", null, def.label),
          h("input", { value: value, onChange: function (e) { onChange(def.key, e.target.value); }, placeholder: "—" })
        );
      }

      function Header(props) {
        var initials = (props.session.fullName || "?").split(/\s+/).map(function (s) { return s[0]; }).slice(0, 2).join("").toUpperCase();
        return h("div", { className: "topbar" },
          h("div", { className: "user-box" },
            h("div", { className: "avatar" }, initials),
            h("div", { className: "meta" },
              h("strong", null, props.session.fullName),
              h("span", null, props.session.facilityCode + " · " + props.session.role)
            )
          ),
          h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
            h("span", { className: "status" + (props.online ? " online" : "") }, props.online ? "Online" : "Offline"),
            h("button", { className: "btn btn-ghost", type: "button", onClick: props.onLogout, style: { width: "auto", padding: "9px 12px" } }, "Log out")
          )
        );
      }

      function HomeScreen(props) {
        var session = props.session;
        var settings = props.settings;
        var consultations = props.consultations;
        var [view, setView] = useState("idle");
        var [transcript, setTranscript] = useState("");
        var [fields, setFields] = useState(emptyFields());
        var [active, setActive] = useState(false);
        var [seconds, setSeconds] = useState(0);

        useEffect(function () {
          if (!active) return;
          var timer = setInterval(function () { setSeconds(function (s) { return s + 1; }); }, 1000);
          return function () { clearInterval(timer); };
        }, [active]);

        function updateField(key, value) {
          setFields(function (prev) {
            var next = Object.assign({}, prev);
            next[key] = value;
            return next;
          });
        }

        function startRecording() {
          setActive(true);
          setFields(emptyFields());
          setTranscript("");
          setSeconds(0);
          setView("recording");
        }

        function stopRecording() {
          setActive(false);
          setView("review");
        }

        function save() {
          var record = {
            id: uid(),
            userId: session.userId,
            chewUsername: session.username,
            facilityCode: session.facilityCode,
            consultDate: nowIso(),
            transcript: transcript,
            fields: fields,
            syncStatus: "Pending",
            createdAt: nowIso()
          };
          props.onSaveConsultation(record);
          if (navigator.onLine && settings.cloudSync && settings.cloudUrl && settings.cloudKey) {
            Cloud.syncPending().catch(function () {});
          }
          setView("idle");
          setTranscript("");
          setFields(emptyFields());
          setSeconds(0);
        }

        function mmss(s) {
          var m = Math.floor(s / 60);
          var ss = s % 60;
          return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
        }

        if (view === "idle") {
          return h("div", null,
            h("div", { className: "hero" },
              h("h2", null, "Start a consultation"),
              h("p", null, "Tap and dictate — the chart fills itself as you talk")
            ),
            h("div", { className: "record-btn-wrap" },
              h("button", { type: "button", className: "record-btn" + (active ? " active" : ""), onClick: active ? stopRecording : startRecording }, active ? "Stop" : "Record")
            ),
            h("p", { className: "rec-hint" }, "Speak naturally: patient name is..., age..., temperature is..., diagnosis is..., treatment is...")
          );
        }

        if (view === "recording") {
          return h("div", null,
            h("div", { className: "section" },
              h("div", { style: { textAlign: "center" } },
                h("button", { type: "button", className: "record-btn active", onClick: stopRecording }, "Stop"),
                h("div", { style: { marginTop: 14, fontFamily: "monospace", fontSize: "1.4rem" } }, mmss(seconds))
              ),
              h("div", { className: "transcript-box", style: { marginTop: 18 } }, transcript || "Listening… start speaking the consultation details.")
            )
          );
        }

        return h("div", null,
          h("div", { className: "section" },
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
              h("h2", { style: { margin: 0, fontSize: "1.05rem" } }, "Review & edit"),
              h("span", { style: { fontSize: "0.8rem", color: "var(--muted)", fontFamily: "monospace" } }, mmss(seconds) + " recorded")
            ),
            h("div", { className: "transcript-box", style: { marginTop: 12 } }, transcript || "No speech captured — fill the chart in manually below.")
          ),
          h("div", { className: "section" },
            FIELD_GROUPS.map(function (group) {
              return h("div", { key: group.key, style: { marginBottom: 16 } },
                h("div", { className: "section-title" }, group.title),
                group.fields.map(function (field) {
                  return h(Field, { key: field.key, def: field, value: fields[field.key], onChange: updateField });
                })
              );
            }),
            h("div", { className: "action-row" },
              h("button", { type: "button", className: "btn btn-ghost", onClick: function () { setView("idle"); setTranscript(""); setFields(emptyFields()); setSeconds(0); } }, "Discard"),
              h("button", { type: "button", className: "btn btn-primary", onClick: save }, "Save offline")
            )
          )
        );
      }

      function HistoryScreen(props) {
        var mine = props.consultations.filter(function (c) { return c.userId === props.session.userId; }).sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        var [selected, setSelected] = useState(null);

        if (mine.length === 0) return h("div", { className: "empty" }, "No consultations saved yet.");

        return h("div", { className: "list" },
          mine.map(function (rec) {
            return h("div", { key: rec.id, className: "consult-card", onClick: function () { setSelected(rec); } },
              h("div", { className: "consult-top" },
                h("div", null,
                  h("div", { className: "consult-name" }, rec.fields.fullName || "Unnamed patient"),
                  h("div", { className: "consult-date" }, fmtDate(rec.createdAt))
                ),
                h("span", { className: "sync-pill" + (rec.syncStatus === "Synced" ? " synced" : "") }, rec.syncStatus || "Pending")
              ),
              h("div", { style: { marginTop: 8, color: "var(--muted)", fontSize: "0.82rem" } }, rec.fields.diagnosis || rec.fields.chiefComplaint || "No diagnosis recorded")
            );
          }),
          selected ? h("div", { className: "modal", key: "modal" },
            h("div", { className: "modal-sheet" },
              h("button", { type: "button", className: "modal-close", onClick: function () { setSelected(null); } }, "×"),
              h("h3", { style: { margin: "0 0 10px" } }, selected.fields.fullName || "Unnamed patient"),
              h("div", { className: "split-muted", style: { marginBottom: 14 } }, fmtDate(selected.createdAt) + " · " + (selected.syncStatus || "Pending")),
              FIELD_GROUPS.map(function (group) {
                var any = group.fields.some(function (field) { return selected.fields[field.key]; });
                if (!any) return null;
                return h("div", { key: group.key },
                  h("div", { className: "section-title" }, group.title),
                  group.fields.map(function (field) {
                    if (!selected.fields[field.key]) return null;
                    return h("div", { key: field.key, style: { marginBottom: 8, fontSize: "0.88rem" } },
                      h("strong", null, field.label + ": "), selected.fields[field.key]
                    );
                  })
                );
              }),
              h("div", { className: "section-title" }, "Raw transcript"),
              h("div", { className: "transcript-box" }, selected.transcript || "—"),
              h("div", { style: { marginTop: 16 } },
                h("button", { type: "button", className: "btn btn-danger", onClick: function () { props.onDelete(selected.id); setSelected(null); } }, "Delete record")
              )
            )
          ) : null
        );
      }

      function ExportScreen(props) {
        var mine = props.consultations.filter(function (c) { return c.userId === props.session.userId; });

        function download(filename, content, type) {
          var blob = new Blob([content], { type: type || "text/plain;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
        }

        function doCsv() {
          if (!mine.length) { props.onToast("No consultations to export yet."); return; }
          var lines = ["facility_code,chew_username,patient_name,diagnosis,created_at"];
          mine.forEach(function (r) {
            lines.push([r.facilityCode, r.chewUsername, (r.fields.fullName || ""), (r.fields.diagnosis || ""), r.createdAt].map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","));
          });
          download("chew_export_" + new Date().toISOString().slice(0, 10) + ".csv", lines.join("\n"));
        }

        function doJson() {
          if (!mine.length) { props.onToast("No consultations to export yet."); return; }
          download("chew_export_" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(mine, null, 2), "application/json");
        }

        return h("div", null,
          h("div", { className: "section" },
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "CSV export"), h("div", { className: "dd" }, "Export all patient consultations")),
              h("button", { type: "button", className: "btn btn-primary", style: { width: "auto", padding: "10px 14px" }, onClick: doCsv }, "Download")
            ),
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "JSON export"), h("div", { className: "dd" }, "Raw record payload")),
              h("button", { type: "button", className: "btn btn-ghost", style: { width: "auto", padding: "10px 14px" }, onClick: doJson }, "Download")
            )
          )
        );
      }

      function SettingsScreen(props) {
        var settings = props.settings;

        function setNext(patch) {
          props.onUpdateSettings(Object.assign({}, settings, patch));
        }

        return h("div", null,
          h("div", { className: "card" },
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "Dictation language"), h("div", { className: "dd" }, "Set the speech recognition language")),
              h("select", { value: settings.language, onChange: function (e) { setNext({ language: e.target.value }); }, style: { padding: "8px 10px", borderRadius: 8, border: "1px solid var(--border)" } },
                h("option", { value: "en-US" }, "English (US)"),
                h("option", { value: "en-GB" }, "English (UK)"),
                h("option", { value: "ha-NG" }, "Hausa"),
                h("option", { value: "yo-NG" }, "Yoruba"),
                h("option", { value: "ig-NG" }, "Igbo")
              )
            ),
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "Cloud backup"), h("div", { className: "dd" }, "Sync records when online")),
              h("label", { className: "switch" },
                h("input", { type: "checkbox", checked: !!settings.cloudSync, onChange: function (e) { setNext({ cloudSync: e.target.checked }); } }),
                h("span", { className: "track" })
              )
            )
          ),
          h("div", { className: "card", style: { marginTop: 16 } },
            h("div", { className: "section-title" }, "Cloud configuration"),
            h("div", { className: "cloud-config" },
              h("div", { className: "field" },
                h("label", null, "Cloud URL"),
                h("input", { value: settings.cloudUrl || "", onChange: function (e) { setNext({ cloudUrl: e.target.value.trim() }); }, placeholder: "https://xyz.supabase.co" })
              ),
              h("div", { className: "field" },
                h("label", null, "API key"),
                h("input", { type: "password", value: settings.cloudKey || "", onChange: function (e) { setNext({ cloudKey: e.target.value.trim() }); }, placeholder: "Enter the API key" })
              )
            )
          ),
          h("div", { className: "card", style: { marginTop: 16 } },
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "Signed in as")),
              h("div", { className: "split-muted" }, props.session.username)
            ),
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "Facility code")),
              h("div", { className: "split-muted" }, props.session.facilityCode)
            ),
            h("div", { className: "settings-row" },
              h("div", null, h("div", { className: "tt" }, "Role")),
              h("div", { className: "split-muted" }, props.session.role)
            )
          )
        );
      }

      function App() {
        var [screen, setScreen] = useState("login");
        var [session, setSession] = useState(Store.getSession());
        var [consultations, setConsultations] = useState(Store.getConsults());
        var [settings, setSettings] = useState(Store.getSettings());
        var [toast, setToast] = useState("");

        useEffect(function () {
          if (session) {
            setScreen("home");
          }
        }, [session]);

        useEffect(function () {
          Store.saveSettings(settings);
        }, [settings]);

        useEffect(function () {
          var timeout;
          if (toast) {
            timeout = setTimeout(function () { setToast(""); }, 2200);
          }
          return function () { if (timeout) clearTimeout(timeout); };
        }, [toast]);

        function handleAuthed(nextSession) {
          setSession(nextSession);
          setScreen("home");
        }

        function handleSave(record) {
          var next = Store.getConsults();
          next.unshift(record);
          Store.saveConsults(next);
          setConsultations(next);
        }

        function handleDelete(id) {
          var next = Store.getConsults().filter(function (item) { return item.id !== id; });
          Store.saveConsults(next);
          setConsultations(next);
        }

        function updateSettings(nextSettings) {
          setSettings(nextSettings);
        }

        if (!session && screen === "login") {
          return h("div", { className: "app-shell" }, h(LoginScreen, { onAuthed: handleAuthed, onGoRegister: function () { setScreen("register"); } }));
        }

        if (!session && screen === "register") {
          return h("div", { className: "app-shell" }, h(RegisterScreen, { onAuthed: handleAuthed, onGoLogin: function () { setScreen("login"); } }));
        }

        var nav = [
          { key: "home", label: "Home" },
          { key: "history", label: "History" },
          { key: "export", label: "Export" },
          { key: "settings", label: "Settings" }
        ];

        var screenContent;
        if (screen === "history") {
          screenContent = h(HistoryScreen, { session: session, consultations: consultations, onDelete: handleDelete });
        } else if (screen === "export") {
          screenContent = h(ExportScreen, { session: session, consultations: consultations, onToast: setToast });
        } else if (screen === "settings") {
          screenContent = h(SettingsScreen, { session: session, settings: settings, onUpdateSettings: updateSettings });
        } else {
          screenContent = h(HomeScreen, { session: session, settings: settings, consultations: consultations, onSaveConsultation: handleSave, onToast: setToast });
        }

        return h("div", { className: "app-shell" },
          h(Header, { session: session, online: navigator.onLine, onLogout: function () { Auth.logout(); setSession(null); setScreen("login"); } }),
          h("div", { className: "nav" },
            nav.map(function (item) {
              return h("button", { type: "button", key: item.key, className: item.key === screen ? "active" : "", onClick: function () { setScreen(item.key); } }, item.label);
            })
          ),
          screenContent,
          toast ? h("div", { style: { position: "fixed", left: 0, right: 0, bottom: 24, display: "flex", justifyContent: "center" } },
            h("div", { style: { background: "#12241f", color: "#fff", borderRadius: 999, padding: "10px 18px", boxShadow: "0 8px 24px rgba(0,0,0,0.25)" } }, toast)
          ) : null
        );
      }

      var root = document.getElementById("root");
      ReactDOM.createRoot(root).render(h(App));
    })();
  </script>
</body>
</html>
